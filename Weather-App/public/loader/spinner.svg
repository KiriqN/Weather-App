<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" role="img" aria-label="Loading">
<style>
.sp-arc{transform-box:view-box;transform-origin:12px 12px;animation:sp-spin .9s linear infinite}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sp-arc{animation:sp-pulse 1.6s ease-in-out infinite}@keyframes sp-pulse{50%{opacity:.4}}}
</style>
<circle cx="12" cy="12" r="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>
<path class="sp-arc" d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="#C9C7BF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
