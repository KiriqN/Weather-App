<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
<style>
.cn-moon{transform-box:view-box;transform-origin:12px 12px;animation:cn-sway 6s ease-in-out infinite alternate}
@keyframes cn-sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<path class="cn-moon" stroke="#B9B3F0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/>
</svg>
