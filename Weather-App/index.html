<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-app</title>
  </head>
  <body>
    <div class="container mx-auto px-4">
      <h1 class="pt-10 text-[28px] font-medium tracking-tight text-gray-100">
        Weather
      </h1>
      <p class="my-2 text-[15px] text-gray-400">
        Search a place to add it to your list.
      </p>
      <form id="search-form" class="flex">
        <div class="relative flex-1 md:flex-none md:w-80">
          <input
            type="text"
            id="locationInput"
            for="fname"
            placeholder="Search for a city..."
            class="w-full rounded-lg border border-white/10 bg-[#242424] px-3 py-2.5 text-sm text-gray-100 placeholder:text-gray-500 focus:border-white/30 focus:outline-none focus:ring-2 focus:ring-white/10"
          />
          <ul
            id="suggestions"
            class="absolute hidden left-0 right-0 top-full z-10 rounded-lg border border-white/10 bg-[#242424] p-1"
          ></ul>
        </div>

        <input
          type="submit"
          value="Search"
          class="shrink-0 rounded-lg ml-2 bg-gray-100 px-5 py-2.5 text-sm font-medium text-[#1a1a1a] hover:bg-white"
        />
      </form>
      

      <div id="api"></div>
      <div id="spinner" class="mt-5"><img src="./public/loader/spinner.svg" alt="Loading..." /></div>
      <div
        id="card"
        class="grid justify-center mt-10 grid-cols-[repeat(auto-fill,200px)] gap-8"
      >
    
    </div>
    <!--<div id="app"></div> -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
